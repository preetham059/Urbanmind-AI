version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: urbanmind_db
    environment:
      POSTGRES_USER: urbanmind
      POSTGRES_PASSWORD: urbanmind123
      POSTGRES_DB: urbanmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: urbanmind_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: